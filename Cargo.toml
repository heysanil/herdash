[package]
name = "herdash"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Terminal dashboard for herdr agent fleets"
license = "MIT"

[lib]
name = "herdash"
path = "src/lib.rs"

[[bin]]
name = "herdash"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
ratatui = "0.30"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "rustls-native-certs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.20"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "signal"] }

[dev-dependencies]
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "test-util"] }
